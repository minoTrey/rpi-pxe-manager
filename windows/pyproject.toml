[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-netboot-windows"
version = "0.1.0"
description = "Generate Windows-side plans for Raspberry Pi network boot."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "RPI Netboot Windows contributors" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
rpi-win-netboot = "rpi_netboot_windows.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
